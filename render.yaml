services:
  - type: web
    name: synapse-arm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GRADIO_SERVER_NAME
        value: "0.0.0.0"
      - key: GRADIO_SERVER_PORT
        value: "10000"
